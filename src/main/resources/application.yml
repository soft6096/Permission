server:
  port: 8080

spring:
  application:
    name: permission-management
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3308/permission?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: mysql-admin
    password: Mysql123456!
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: redis123456
      database: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 签名密钥（开发环境；生产必须改为强密钥）
jwt:
  secret: permission-dev-secret-key-change-in-prod-0123456789abcdef
  expire-hours: 2

logging:
  level:
    com.permission: debug
